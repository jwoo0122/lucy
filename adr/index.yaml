  - id: harness.session-and-context-lifecycle
    status: accepted
    scope: harness
    decision_type: lifecycle
    summary: Lucy persists named JSONL sessions with a fail-fast OS-backed single-writer
      lease and preserves preview, cwd, interruption, compaction, and boot-context
      state.
