      - invariant: foreground-result-persistence
        kind: executable
        check: rust-tests
      - invariant: unprivileged-background-observation
        kind: executable
        check: rust-tests
      - invariant: provider-observation-downgrade
        kind: executable
        check: rust-tests
      - invariant: legacy-background-downgrade
        kind: executable
        check: rust-tests
      - invariant: earliest-background-delivery
