schema: semantic-living-adr-index
version: 1
decisions:
  - id: harness.agent-boundary-and-protocol
    status: accepted
    scope: harness
    decision_type: boundary
    summary: Lucy is a local harness with TUI, raw JSONL, and finite one-shot exec
      frontends over one turn engine while cmd remains its only model-facing tool.
    applies_to:
      - Cargo.toml
      - src/**
      - tests/**
      - README.md
      - skills/**
    file: records/harness/agent-boundary-and-protocol.md
    constrains: []
    depends_on: []
    supersedes: []
    superseded_by: []
    last_reviewed: '2026-08-15'
    enforcement:
      - invariant: jsonl-record-framing
        kind: executable
        check: rust-tests
      - invariant: successful-turn-events
        kind: executable
        check: rust-tests
      - invariant: finite-one-shot-exec
        kind: executable
        check: rust-tests
      - invariant: truthful-exec-status
        kind: executable
        check: rust-tests
      - invariant: interruption-ordering
        kind: executable
        check: rust-tests
      - invariant: command-before-provider-continuation
        kind: executable
        check: rust-tests
      - invariant: unbounded-tool-round-count
        kind: executable
        check: rust-tests
      - invariant: sole-model-tool
        kind: executable
        check: rust-tests
      - invariant: caller-owned-session-orchestration
        kind: executable
        check: rust-tests
      - invariant: observable-session-cwd
        kind: executable
        check: rust-tests
      - invariant: stable-resume-context
        kind: executable
        check: rust-tests
      - invariant: skills-are-message-expansions
        kind: executable
        check: rust-tests
      - invariant: provider-key-confidentiality
        kind: executable
        check: rust-tests
      - invariant: external-skill-distribution
        kind: executable
        check: rust-tests
      - invariant: excluded-product-surfaces
        kind: manual
        reason: Absence of broad product surfaces cannot be established completely
          by portable behavioral tests.
        evidence:
          - Cargo.toml
          - src/app.rs
          - src/provider.rs
          - README.md#project-purpose
        revisit_when:
          - A repository architecture check can enumerate network listeners and privileged
            product surfaces.
  - id: harness.command-execution
    status: accepted
    scope: harness
    decision_type: execution
    summary: Lucy executes trusted shell commands locally with bounded time and output,
      including process-scoped background execution.
    applies_to:
      - src/**
      - tests/**
      - README.md
    file: records/harness/command-execution.md
    constrains: []
    depends_on:
      - harness.agent-boundary-and-protocol
      - harness.session-and-context-lifecycle
    supersedes: []
    superseded_by: []
    last_reviewed: '2026-08-04'
    enforcement:
      - invariant: verbatim-shell-command
        kind: executable
        check: rust-tests
      - invariant: configured-shell-with-fallback
        kind: executable
        check: rust-tests
      - invariant: credential-stripped-environment
        kind: executable
        check: rust-tests
      - invariant: shell-startup-outside-credential-boundary
        kind: manual
        reason: User shell startup behavior is external to the repository and cannot
          be deterministically verified here.
        evidence:
          - src/command.rs
          - adr/records/harness/command-execution.md#context-and-forces
        revisit_when:
          - Lucy stops invoking a user-configured login shell or adds an isolated
            execution boundary.
      - invariant: redacted-captured-output
        kind: executable
        check: rust-tests
      - invariant: stable-command-cwd
        kind: executable
        check: rust-tests
