name: Restack final reliability PR

on:
  pull_request:
    branches:
      - agent/session-journal-safety

permissions:
  contents: write

jobs:
  restack:
    if: github.head_ref == 'agent/intra-turn-compaction-pruning' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/intra-turn-compaction-pruning
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Merge updated parent and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin agent/session-journal-safety agent/intra-turn-compaction-pruning
          git merge --no-commit --no-ff origin/agent/session-journal-safety
          cargo fmt --all
          cargo clippy --all-targets --locked -- -D warnings
          XDG_CONFIG_HOME="" cargo test --locked
          git add .
          git commit -m "chore: restack on agent/session-journal-safety"
          git push origin HEAD:agent/intra-turn-compaction-pruning

          git checkout -B agent/session-journal-safety origin/agent/session-journal-safety
          rm .github/workflows/restack-intra-turn.yml
          git add .github/workflows/restack-intra-turn.yml
          git commit -m "chore: remove final restack validator"
          git push origin HEAD:agent/session-journal-safety
