name: Apply session journal safety

on:
  push:
    branches:
      - agent/session-journal-safety

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/session-journal-safety
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply journal safety implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lease = r'''use std::fs::{File, OpenOptions};
          use std::path::{Path, PathBuf};

          use crate::config::{ensure_not_symlink, ensure_private_dir, lucy_dir};

          #[cfg(unix)]
          use std::os::fd::AsRawFd;
          #[cfg(unix)]
          use std::os::unix::fs::{OpenOptionsExt, PermissionsExt};

          #[derive(Debug)]
          pub(super) struct SessionLease {
              file: File,
              #[cfg(not(unix))]
              path: PathBuf,
          }

          impl SessionLease {
              pub(super) fn acquire(home: &Path, session_id: &str) -> Result<Self, String> {
                  let lucy = lucy_dir(home);
                  ensure_not_symlink(&lucy)
                      .map_err(|_| "session writer lease directory is unsafe".to_owned())?;
                  ensure_private_dir(&lucy)
                      .map_err(|_| "unable to secure session writer lease directory".to_owned())?;
                  let directory = lucy.join("locks");
                  ensure_not_symlink(&directory)
                      .map_err(|_| "session writer lease directory is unsafe".to_owned())?;
                  ensure_private_dir(&directory)
                      .map_err(|_| "unable to secure session writer lease directory".to_owned())?;
                  let path = directory.join(format!("{session_id}.lock"));
                  ensure_not_symlink(&path)
                      .map_err(|_| "session writer lease is unsafe".to_owned())?;

                  #[cfg(unix)]
                  {
                      let mut options = OpenOptions::new();
                      options.read(true).write(true).create(true);
                      options.mode(0o600);
                      options.custom_flags(libc::O_NOFOLLOW | libc::O_NONBLOCK);
                      let file = options
                          .open(&path)
                          .map_err(|_| "unable to open session writer lease".to_owned())?;
                      let metadata = file
                          .metadata()
                          .map_err(|_| "unable to inspect session writer lease".to_owned())?;
                      if !metadata.is_file() || metadata.permissions().mode() & 0o777 != 0o600 {
                          return Err("session writer lease is not a private regular file".to_owned());
                      }
                      let result = unsafe {
                          libc::flock(file.as_raw_fd(), libc::LOCK_EX | libc::LOCK_NB)
                      };
                      if result != 0 {
                          let error = std::io::Error::last_os_error();
                          if matches!(error.raw_os_error(), Some(libc::EWOULDBLOCK | libc::EAGAIN)) {
                              return Err("session is already open for writing".to_owned());
                          }
                          return Err("unable to acquire session writer lease".to_owned());
                      }
                      file.sync_data()
                          .map_err(|_| "unable to checkpoint session writer lease".to_owned())?;
                      return Ok(Self { file });
                  }

                  #[cfg(not(unix))]
                  {
                      let file = OpenOptions::new()
                          .read(true)
                          .write(true)
                          .create_new(true)
                          .open(&path)
                          .map_err(|error| {
                              if error.kind() == std::io::ErrorKind::AlreadyExists {
                                  "session is already open for writing".to_owned()
                              } else {
                                  "unable to acquire session writer lease".to_owned()
                              }
                          })?;
                      Ok(Self { file, path })
                  }
              }
          }

          impl Drop for SessionLease {
              fn drop(&mut self) {
                  #[cfg(unix)]
                  unsafe {
                      let _ = libc::flock(self.file.as_raw_fd(), libc::LOCK_UN);
                  }
                  #[cfg(not(unix))]
                  {
                      let _ = std::fs::remove_file(&self.path);
                  }
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use std::sync::atomic::{AtomicU64, Ordering};

              static COUNTER: AtomicU64 = AtomicU64::new(0);

              fn home() -> PathBuf {
                  let path = std::env::temp_dir().join(format!(
                      "lucy-session-lease-{}-{}",
                      std::process::id(),
                      COUNTER.fetch_add(1, Ordering::Relaxed)
                  ));
                  std::fs::create_dir(&path).expect("home");
                  path
              }

              #[test]
              fn a_second_writer_fails_without_waiting() {
                  let home = home();
                  let first = SessionLease::acquire(&home, "session").expect("first lease");
                  let error = SessionLease::acquire(&home, "session")
                      .expect_err("second writer must fail");
                  assert_eq!(error, "session is already open for writing");
                  drop(first);
                  SessionLease::acquire(&home, "session").expect("lease after release");
                  std::fs::remove_dir_all(home).expect("cleanup");
              }
          }
          '''

          recovery = r'''use std::collections::hash_map::DefaultHasher;
          use std::fs::{self, OpenOptions};
          use std::hash::{Hash, Hasher};
          use std::io::Write;
          use std::path::Path;
          use std::time::{SystemTime, UNIX_EPOCH};

          use crate::config::{
              ensure_not_symlink, ensure_private_dir, ensure_private_file, lucy_dir,
          };

          #[cfg(unix)]
          use std::os::unix::fs::OpenOptionsExt;

          pub(super) fn recover_journals(home: &Path, session_id: &str) -> Result<(), String> {
              let transcript = super::sessions_dir(home).join(format!("{session_id}.jsonl"));
              recover_tail(home, session_id, "session", &transcript, true)?;
              let lifecycle = lucy_dir(home)
                  .join("turns")
                  .join(format!("{session_id}.jsonl"));
              recover_tail(home, session_id, "turn", &lifecycle, false)
          }

          fn recover_tail(
              home: &Path,
              session_id: &str,
              journal: &str,
              path: &Path,
              required: bool,
          ) -> Result<(), String> {
              ensure_not_symlink(path).map_err(|_| format!("{journal} journal is unsafe"))?;
              if !path.exists() {
                  return if required {
                      Err("session not found".to_owned())
                  } else {
                      Ok(())
                  };
              }
              ensure_private_file(path)
                  .map_err(|_| format!("{journal} journal is not private"))?;
              let raw = fs::read(path).map_err(|_| format!("unable to read {journal} journal"))?;
              if raw.is_empty() || raw.last() == Some(&b'\n') {
                  return Ok(());
              }
              let Some(last_newline) = raw.iter().rposition(|byte| *byte == b'\n') else {
                  return Err(format!("{journal} journal has no complete record"));
              };
              let committed_len = last_newline + 1;
              let tail = &raw[committed_len..];
              write_recovery_evidence(home, session_id, journal, tail)?;

              let mut options = OpenOptions::new();
              options.write(true);
              #[cfg(unix)]
              options.custom_flags(libc::O_NOFOLLOW | libc::O_NONBLOCK);
              let file = options
                  .open(path)
                  .map_err(|_| format!("unable to recover {journal} journal"))?;
              file.set_len(committed_len as u64)
                  .map_err(|_| format!("unable to recover {journal} journal"))?;
              file.sync_data()
                  .map_err(|_| format!("unable to checkpoint recovered {journal} journal"))?;
              Ok(())
          }

          fn write_recovery_evidence(
              home: &Path,
              session_id: &str,
              journal: &str,
              tail: &[u8],
          ) -> Result<(), String> {
              let directory = lucy_dir(home).join("recovery");
              ensure_not_symlink(&directory)
                  .map_err(|_| "session recovery directory is unsafe".to_owned())?;
              ensure_private_dir(&directory)
                  .map_err(|_| "unable to secure session recovery directory".to_owned())?;
              let mut hasher = DefaultHasher::new();
              tail.hash(&mut hasher);
              let timestamp = SystemTime::now()
                  .duration_since(UNIX_EPOCH)
                  .map(|duration| duration.as_millis())
                  .unwrap_or(0);
              let path = directory.join(format!(
                  "{session_id}-{journal}-{timestamp}-{:016x}.json",
                  hasher.finish()
              ));
              let record = serde_json::json!({
                  "record": "recovered_trailing_fragment",
                  "version": 1,
                  "session_id": session_id,
                  "journal": journal,
                  "bytes": tail.len(),
                  "hash": format!("{:016x}", hasher.finish()),
              });
              let mut encoded = serde_json::to_vec(&record)
                  .map_err(|_| "unable to encode session recovery evidence".to_owned())?;
              encoded.push(b'\n');
              let mut options = OpenOptions::new();
              options.write(true).create_new(true);
              #[cfg(unix)]
              options.mode(0o600);
              let mut file = options
                  .open(path)
                  .map_err(|_| "unable to create session recovery evidence".to_owned())?;
              file.write_all(&encoded)
                  .map_err(|_| "unable to write session recovery evidence".to_owned())?;
              file.sync_data()
                  .map_err(|_| "unable to checkpoint session recovery evidence".to_owned())?;
              Ok(())
          }
          '''

          Path('src/session/lease.rs').write_text(lease)
          Path('src/session/recovery.rs').write_text(recovery)

          session_path = Path('src/session.rs')
          source = session_path.read_text()
          marker = '    /// Append a semantic message while maintaining one explicit logical turn.\n'
          if source.count(marker) != 1:
              raise SystemExit('unexpected Session wrapper structure')
          suffix = source[source.index(marker):].replace('self.0', 'self.inner')
          prefix = r'''mod base;
          mod lease;
          mod recovery;
          mod turn;

          use std::ops::{Deref, DerefMut};
          use std::path::Path;
          use std::sync::Arc;

          use crate::config::LlmSettings;
          use crate::context::SkillEntry;
          use crate::model::{ChatMessage, OBSERVATION_ROLE};

          pub use base::{
              sessions_dir, validate_session_id, CompactionRecord, InterruptionRecord, SessionHistoryRecord,
              SessionMetadata, SessionToolResult,
          };
          pub use turn::{
              TurnEvent, TurnKind, TurnLifecycleRecord, TurnOutcome, TurnPhase, TurnState, TurnStatus,
          };

          #[derive(Debug)]
          pub struct SessionError(String);

          impl SessionError {
              fn new(message: impl Into<String>) -> Self {
                  Self(message.into())
              }
          }

          impl std::fmt::Display for SessionError {
              fn fmt(&self, formatter: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
                  formatter.write_str(&self.0)
              }
          }

          impl std::error::Error for SessionError {}

          impl From<base::SessionError> for SessionError {
              fn from(error: base::SessionError) -> Self {
                  Self(error.to_string())
              }
          }

          /// A compatibility wrapper around Lucy's append-only session. Every
          /// mutable handle owns the same process-shared, OS-backed writer lease.
          #[derive(Debug, Clone)]
          pub struct Session {
              inner: base::Session,
              _lease: Arc<lease::SessionLease>,
          }

          impl Deref for Session {
              type Target = base::Session;

              fn deref(&self) -> &Self::Target {
                  &self.inner
              }
          }

          impl DerefMut for Session {
              fn deref_mut(&mut self) -> &mut Self::Target {
                  &mut self.inner
              }
          }

          impl Session {
              fn wrap_created(home: &Path, inner: base::Session) -> Result<Self, SessionError> {
                  let lease = Arc::new(
                      lease::SessionLease::acquire(home, &inner.id).map_err(SessionError::new)?,
                  );
                  Ok(Self {
                      inner,
                      _lease: lease,
                  })
              }

              pub fn create(
                  home: &Path,
                  cwd: &Path,
                  boot_system_prompt: String,
                  llm: LlmSettings,
              ) -> Result<Self, SessionError> {
                  let inner = base::Session::create(home, cwd, boot_system_prompt, llm)
                      .map_err(SessionError::from)?;
                  Self::wrap_created(home, inner)
              }

              pub fn create_with_secret(
                  home: &Path,
                  cwd: &Path,
                  boot_system_prompt: String,
                  llm: LlmSettings,
                  secret: Option<&str>,
              ) -> Result<Self, SessionError> {
                  let inner = base::Session::create_with_secret(
                      home,
                      cwd,
                      boot_system_prompt,
                      llm,
                      secret,
                  )
                  .map_err(SessionError::from)?;
                  Self::wrap_created(home, inner)
              }

              pub fn create_with_skills_and_secret(
                  home: &Path,
                  cwd: &Path,
                  boot_system_prompt: String,
                  llm: LlmSettings,
                  skills: Vec<SkillEntry>,
                  secret: Option<&str>,
              ) -> Result<Self, SessionError> {
                  let inner = base::Session::create_with_skills_and_secret(
                      home,
                      cwd,
                      boot_system_prompt,
                      llm,
                      skills,
                      secret,
                  )
                  .map_err(SessionError::from)?;
                  Self::wrap_created(home, inner)
              }

              pub fn resume(home: &Path, id: &str) -> Result<Self, SessionError> {
                  Self::resume_with_secret(home, id, None)
              }

              pub fn resume_with_secret(
                  home: &Path,
                  id: &str,
                  external_secret: Option<&str>,
              ) -> Result<Self, SessionError> {
                  base::validate_session_id(id).map_err(SessionError::from)?;
                  let lease = Arc::new(
                      lease::SessionLease::acquire(home, id).map_err(SessionError::new)?,
                  );
                  recovery::recover_journals(home, id).map_err(SessionError::new)?;
                  let inner = base::Session::resume_with_secret(home, id, external_secret)
                      .map_err(SessionError::from)?;
                  Ok(Self {
                      inner,
                      _lease: lease,
                  })
              }

              pub fn list(home: &Path) -> Result<Vec<SessionMetadata>, SessionError> {
                  base::Session::list(home).map_err(Into::into)
              }

              pub fn list_with_secret(
                  home: &Path,
                  external_secret: Option<&str>,
              ) -> Result<Vec<SessionMetadata>, SessionError> {
                  base::Session::list_with_secret(home, external_secret).map_err(Into::into)
              }

          '''
          rebuilt = prefix + suffix
          insert = r'''
              #[test]
              fn second_mutable_session_handle_is_rejected_until_the_lease_is_released() {
                  let (home, session) = session();
                  let id = session.id.clone();
                  let error = Session::resume(&home, &id).expect_err("second writer");
                  assert_eq!(error.to_string(), "session is already open for writing");
                  drop(session);
                  Session::resume(&home, &id).expect("writer after release");
                  fs::remove_dir_all(home).expect("cleanup");
              }

              #[test]
              fn resume_recovers_only_an_unterminated_trailing_fragment() {
                  use std::io::Write;
                  let (home, session) = session();
                  let id = session.id.clone();
                  let path = session.path.clone();
                  drop(session);
                  let mut file = std::fs::OpenOptions::new()
                      .append(true)
                      .open(&path)
                      .expect("append partial record");
                  file.write_all(b"{\"record\":\"message\",\"timestamp\":9,\"message\":")
                      .expect("partial record");
                  file.sync_data().expect("partial checkpoint");

                  let resumed = Session::resume(&home, &id).expect("recover trailing fragment");
                  assert!(std::fs::read(&path).expect("transcript").ends_with(b"\n"));
                  assert!(home.join(".lucy/recovery").read_dir().expect("evidence").next().is_some());
                  drop(resumed);
                  fs::remove_dir_all(home).expect("cleanup");
              }

              #[test]
              fn complete_middle_corruption_remains_fatal() {
                  use std::io::Write;
                  let (home, session) = session();
                  let id = session.id.clone();
                  let path = session.path.clone();
                  drop(session);
                  let mut file = std::fs::OpenOptions::new()
                      .append(true)
                      .open(&path)
                      .expect("append corrupt record");
                  file.write_all(b"not-json\n").expect("corrupt record");
                  file.sync_data().expect("corrupt checkpoint");
                  assert!(Session::resume(&home, &id).is_err());
                  fs::remove_dir_all(home).expect("cleanup");
              }
          '''
          end = rebuilt.rfind('\n}')
          if end < 0:
              raise SystemExit('unexpected wrapper test module ending')
          session_path.write_text(rebuilt[:end] + insert + rebuilt[end:])

          base_path = Path('src/session/base.rs')
          base = base_path.read_text()
          old = '''fn write_json_record<T: Serialize>(file: &mut File, record: &T) -> Result<(), SessionError> {
              let line = serde_json::to_string(record)
                  .map_err(|error| SessionError::new(format!("unable to encode session record: {error}")))?;
              file.write_all(line.as_bytes())?;
              file.write_all(b"\\n")?;
              file.flush()?;
              Ok(())
          }'''
          new = '''fn write_json_record<T: Serialize>(file: &mut File, record: &T) -> Result<(), SessionError> {
              let mut line = serde_json::to_vec(record)
                  .map_err(|error| SessionError::new(format!("unable to encode session record: {error}")))?;
              line.push(b'\\n');
              file.write_all(&line)?;
              file.sync_data()?;
              Ok(())
          }'''
          if base.count(old) != 1:
              raise SystemExit('unexpected transcript writer implementation')
          base_path.write_text(base.replace(old, new))

          turn_path = Path('src/session/turn.rs')
          turn = turn_path.read_text()
          old = '''        file.flush()
                  .map_err(|_| "unable to write turn lifecycle journal".to_owned())?;'''
          new = '''        file.sync_data()
                  .map_err(|_| "unable to checkpoint turn lifecycle journal".to_owned())?;'''
          if turn.count(old) != 1:
              raise SystemExit('unexpected lifecycle writer implementation')
          turn_path.write_text(turn.replace(old, new))
          PY

      - name: Format
        run: cargo fmt --all

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        env:
          XDG_CONFIG_HOME: ""
        run: cargo test --locked

      - name: Publish validated implementation
        shell: bash
        run: |
          rm .github/workflows/apply-session-journal-safety.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "fix(session): make journals crash-safe and single-writer"
          git push origin HEAD:agent/session-journal-safety
