name: Validate session journal safety stack

on:
  pull_request:
    branches:
      - agent/compaction-budget-and-fallback-v2

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/session-journal-safety' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/session-journal-safety
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'RUNNER'
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/apply-session-journal-safety.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          replacements = [
              (
                  "use std::path::{Path, PathBuf};",
                  "use std::path::Path;\n#[cfg(any(not(unix), test))]\nuse std::path::PathBuf;",
              ),
              (
                  "if matches!(error.raw_os_error(), Some(libc::EWOULDBLOCK | libc::EAGAIN)) {",
                  "if error.raw_os_error() == Some(libc::EWOULDBLOCK)\n"
                  "    || error.raw_os_error() == Some(libc::EAGAIN)\n"
                  "{",
              ),
              ("return Ok(Self { file });", "Ok(Self { file })"),
          ]
          for old, new in replacements:
              if script.count(old) != 1:
                  raise SystemExit(f'unexpected lease implementation fragment: {old}')
              script = script.replace(old, new)

          lifecycle_start = script.index("turn_path = Path('src/session/turn.rs')")
          lifecycle_patch = (
              "import re\n"
              "turn_path = Path('src/session/turn.rs')\n"
              "turn = turn_path.read_text()\n"
              "turn, turn_count = re.subn(\n"
              "    r'file\\.flush\\(\\)\\n\\s*\\.map_err\\(\\|_\\| \"unable to write turn lifecycle journal\"\\.to_owned\\(\\)\\)\\?;',\n"
              "    'file.sync_data()\\n            .map_err(|_| \"unable to checkpoint turn lifecycle journal\".to_owned())?;',\n"
              "    turn,\n"
              "    count=1,\n"
              ")\n"
              "if turn_count != 1:\n"
              "    raise SystemExit('unexpected lifecycle writer implementation')\n"
              "turn_path.write_text(turn)\n"
          )
          script = script[:lifecycle_start] + lifecycle_patch
          exec(compile(script, 'apply-session-journal-safety', 'exec'))
          RUNNER

      - name: Format
        run: cargo fmt --all

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        env:
          XDG_CONFIG_HOME: ""
        run: cargo test --locked

      - name: Publish validated implementation and restore base workflow
        shell: bash
        run: |
          git fetch origin agent/incremental-compaction-plan agent/compaction-budget-and-fallback-v2
          git checkout origin/agent/incremental-compaction-plan -- .github/workflows/release.yml
          rm -f .github/workflows/apply-session-journal-safety.yml .session-safety-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "fix(session): make journals crash-safe and single-writer"
          git push origin HEAD:agent/session-journal-safety

          git checkout -B agent/compaction-budget-and-fallback-v2 origin/agent/compaction-budget-and-fallback-v2
          git checkout origin/agent/incremental-compaction-plan -- .github/workflows/release.yml
          git add .github/workflows/release.yml
          git commit -m "chore: restore release workflow"
          git push origin HEAD:agent/compaction-budget-and-fallback-v2
