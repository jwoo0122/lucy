name: Restack reliability pull requests

on:
  push:
    branches:
      - agent/turn-lifecycle-records

permissions:
  contents: write

jobs:
  restack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/turn-lifecycle-records
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Merge main and restack descendants
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin \
            main \
            agent/turn-lifecycle-records \
            agent/retry-failed-compaction-turn \
            agent/incremental-compaction-plan \
            agent/compaction-budget-and-fallback-v2 \
            agent/session-journal-safety \
            agent/intra-turn-compaction-pruning

          git merge --no-commit --no-ff origin/main || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            while IFS= read -r path; do
              case "$path" in
                Cargo.toml|Cargo.lock|README.md|adr/*|src/command.rs|src/tui.rs|tests/cli.rs)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                .github/workflows/release.yml)
                  git checkout origin/main -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected merge conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          fi
          git checkout origin/main -- .github/workflows/release.yml
          rm -f .reliability-restack-trigger
          cargo fmt --all
          cargo clippy --all-targets --locked -- -D warnings
          XDG_CONFIG_HOME="" cargo test --locked
          git add .
          git commit -m "chore: merge main into reliability stack"
          git push origin HEAD:agent/turn-lifecycle-records

          parent=agent/turn-lifecycle-records
          for child in \
            agent/retry-failed-compaction-turn \
            agent/incremental-compaction-plan \
            agent/compaction-budget-and-fallback-v2 \
            agent/session-journal-safety \
            agent/intra-turn-compaction-pruning
          do
            git checkout -B "$child" "origin/$child"
            git merge --no-commit --no-ff "origin/$parent"
            cargo fmt --all
            cargo clippy --all-targets --locked -- -D warnings
            XDG_CONFIG_HOME="" cargo test --locked
            git add .
            git commit -m "chore: restack on $parent"
            git push origin "HEAD:$child"
            parent="$child"
          done
