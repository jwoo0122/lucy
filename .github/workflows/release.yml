name: Apply compaction budget patch

on:
  pull_request:
    branches:
      - agent/incremental-compaction-plan

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/compaction-budget-and-fallback' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/compaction-budget-and-fallback
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply budget trigger
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/app.rs')
          source = path.read_text()
          source, constant_count = re.subn(
              r'^const AUTO_COMPACTION_THRESHOLD_PERCENT: usize = 95;\n',
              '',
              source,
              flags=re.MULTILINE,
          )
          pattern = re.compile(
              r'fn should_compact_context\(context_tokens: usize, context_window: usize\) -> bool \{\n'
              r'\s*context_window > 0\n'
              r'\s*&& context_tokens as u128 \* 100\n'
              r'\s*>= context_window as u128 \* AUTO_COMPACTION_THRESHOLD_PERCENT as u128\n'
              r'\}'
          )
          replacement = '''fn should_compact_context(context_tokens: usize, context_window: usize) -> bool {
              crate::context_budget::should_compact(context_tokens, context_window)
          }'''
          source, function_count = pattern.subn(replacement, source)
          if constant_count != 1 or function_count != 1:
              raise SystemExit(
                  f'unexpected compaction trigger matches: constant={constant_count}, function={function_count}'
              )
          path.write_text(source)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        env:
          XDG_CONFIG_HOME: ""
        run: cargo test --locked

      - name: Restore release workflow and publish validated patch
        shell: bash
        run: |
          git fetch origin agent/incremental-compaction-plan
          git checkout origin/agent/incremental-compaction-plan -- .github/workflows/release.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "feat(compaction): apply reserved context trigger"
          git push origin HEAD:agent/compaction-budget-and-fallback
