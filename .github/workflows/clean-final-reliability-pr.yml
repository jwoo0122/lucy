name: Build clean final reliability branch

on:
  pull_request:
    branches:
      - agent/session-journal-safety

permissions:
  contents: write

jobs:
  clean-branch:
    if: github.head_ref == 'agent/intra-turn-compaction-pruning' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/session-journal-safety
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply only validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin agent/session-journal-safety agent/intra-turn-compaction-pruning
          git checkout -B agent/intra-turn-compaction-pruning-clean origin/agent/session-journal-safety
          git diff --binary \
            origin/agent/session-journal-safety..origin/agent/intra-turn-compaction-pruning \
            -- \
            src/app.rs \
            src/context_budget.rs \
            src/intra_turn.rs \
            src/lib.rs \
            src/provider.rs \
            src/session.rs \
            src/tool_pruning.rs \
            > /tmp/intra-turn.patch
          git apply /tmp/intra-turn.patch
          cargo fmt --all
          cargo clippy --all-targets --locked -- -D warnings
          XDG_CONFIG_HOME="" cargo test --locked
          git add src
          git commit -m "feat(compaction): support safe intra-turn cuts and tool-output pruning"
          git push --force origin HEAD:agent/intra-turn-compaction-pruning-clean

          git checkout -B agent/session-journal-safety origin/agent/session-journal-safety
          rm .github/workflows/clean-final-reliability-pr.yml
          git add .github/workflows/clean-final-reliability-pr.yml
          git commit -m "chore: remove final branch cleaner"
          git push origin HEAD:agent/session-journal-safety
