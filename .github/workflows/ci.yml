name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/turn-lifecycle-records
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply formatting
        run: cargo fmt --all

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        env:
          XDG_CONFIG_HOME: ""
        run: cargo test --locked

      - name: Restore CI definition and publish formatting
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet; then
            exit 0
          fi
          git add .
          git commit -m "style: apply current rustfmt output"
          git push origin HEAD:agent/turn-lifecycle-records
