# temporary branch-local validation; restored after success
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/turn-lifecycle-records
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Make transcript fixtures select JSONL explicitly
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("tests/cli.rs")
          source = path.read_text()
          marker = '''fn parse_lines(output: &[u8]) -> Vec<Value> {
              String::from_utf8(output.to_vec())
                  .expect("UTF-8 stdout")
                  .lines()
                  .map(|line| serde_json::from_str(line).expect("JSONL output"))
                  .collect()
          }
'''
          helper = marker + '''
          fn session_transcript_path(home: &Path) -> PathBuf {
              let mut transcripts = fs::read_dir(home.join(".lucy/sessions"))
                  .expect("sessions")
                  .map(|entry| entry.expect("session entry").path())
                  .filter(|path| path.extension().and_then(|extension| extension.to_str()) == Some("jsonl"))
                  .collect::<Vec<_>>();
              transcripts.sort();
              assert_eq!(transcripts.len(), 1, "expected one session transcript");
              transcripts.remove(0)
          }
'''
          if source.count(marker) != 1:
              raise SystemExit("unexpected parse_lines helper")
          source = source.replace(marker, helper)

          pattern = re.compile(
              r'''let session_file = fs::read_dir\(home\.join\("\.lucy/sessions"\)\)\s*\n'''
              r'''\s*\.expect\("sessions"\)\s*\n'''
              r'''\s*\.next\(\)\s*\n'''
              r'''\s*\.expect\("session entry"\)\s*\n'''
              r'''\s*\.expect\("session file"\)\s*\n'''
              r'''\s*\.path\(\);'''
          )
          source, count = pattern.subn(
              'let session_file = session_transcript_path(&home);',
              source,
          )
          if count < 3:
              raise SystemExit(f"unexpected transcript selection count: {count}")
          path.write_text(source)
          PY

      - name: Apply formatting
        run: cargo fmt --all

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        env:
          XDG_CONFIG_HOME: ""
        run: cargo test --locked

      - name: Restore CI definition and publish validated changes
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "test(session): select transcript independently of sidecars"
          git push origin HEAD:agent/turn-lifecycle-records
