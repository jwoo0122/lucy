name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/turn-lifecycle-records
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app.rs")
          source = path.read_text()
          old = '''    if let Err(error) =
              session.append_provider_settings(session.llm.model.clone(), session.llm.effort.clone())
          {'''
          new = '''    let selected_model = session.llm.model.clone();
          let selected_effort = session.llm.effort.clone();
          if let Err(error) = session.append_provider_settings(selected_model, selected_effort) {'''
          if source.count(old) != 1:
              raise SystemExit("unexpected provider settings call")
          path.write_text(source.replace(old, new))
          PY

      - name: Apply formatting
        run: cargo fmt --all

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        env:
          XDG_CONFIG_HOME: ""
        run: cargo test --locked

      - name: Restore CI definition and publish validated changes
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "fix(session): preserve wrapper call compatibility"
          git push origin HEAD:agent/turn-lifecycle-records
