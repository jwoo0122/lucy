name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install ADR checker dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Test and check ADR conformance
        env:
          # Keep tests isolated from runner-level XDG configuration.
          XDG_CONFIG_HOME: ""
        run: scripts/adr check
